openapi: 3.1.0
info:
  title: E-Commerce Microservices API
  version: 0.1.0
  description: >
    Client-facing REST API. All requests go through the API Gateway (:3000),
    which proxies to Auth (:3001), Product (:3002) and Order (:3003).
    Internal sync calls (Order -> Inventory, Order -> Payment) are gRPC and
    documented in packages/contracts/proto/*.proto. Async flows use Kafka
    topics documented in packages/contracts/src/events/.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: auth
  - name: products
  - name: cart
  - name: orders
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
    AuthResponse:
      type: object
      required: [userId, accessToken, refreshToken, expiresIn]
      properties:
        userId: { type: string, format: uuid }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: seconds until access token expiry }
    Product:
      type: object
      required: [productId, name, description, priceCents, currency, category, imageUrl, available]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
        category: { type: string }
        imageUrl: { type: string, nullable: true }
        available: { type: integer }
    ProductListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CartItem:
      type: object
      required: [productId, name, quantity, unitPriceCents, imageUrl]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        imageUrl: { type: string, nullable: true }
    Cart:
      type: object
      required: [items, totalCents, currency]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        totalCents: { type: integer }
        currency: { type: string }
    Order:
      type: object
      required: [orderId, items, totalCents, currency, status, createdAt, confirmedAt]
      properties:
        orderId: { type: string, format: uuid }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        totalCents: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, PAYMENT_FAILED] }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
    OrderListResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        total: { type: integer }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string, minLength: 1 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '409': { description: Email already registered }
        '422': { description: Validation failed }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token, issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid refresh token }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [userId, email, displayName]
                properties:
                  userId: { type: string, format: uuid }
                  email: { type: string, format: email }
                  displayName: { type: string }
        '401': { description: Unauthorized }
  /products:
    get:
      tags: [products]
      summary: List products (public, cached in Redis)
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: minPriceCents, in: query, schema: { type: integer } }
        - { name: maxPriceCents, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
        - { name: sort, in: query, schema: { type: string, enum: [price_asc, price_desc, newest], default: newest } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductListResponse' } } } }
    post:
      tags: [products]
      summary: Create product (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, priceCents, currency, category, stock]
              properties:
                name: { type: string }
                description: { type: string }
                priceCents: { type: integer }
                currency: { type: string }
                category: { type: string }
                stock: { type: integer }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /products/{productId}:
    get:
      tags: [products]
      summary: Get a single product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { description: Not found }
  /cart:
    get:
      tags: [cart]
      summary: Get current user's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
    post:
      tags: [cart]
      summary: Add item to cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK (returns updated cart), content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { description: Product not found }
  /cart/items/{productId}:
    patch:
      tags: [cart]
      summary: Update item quantity (0 removes)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        '200': { description: OK (returns updated cart), content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
    delete:
      tags: [cart]
      summary: Remove item from cart
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK (returns updated cart), content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /orders:
    get:
      tags: [orders]
      summary: List current user's orders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderListResponse' } } } }
    post:
      tags: [orders]
      summary: Checkout — starts the order saga (reserve stock -> authorize payment)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId]
              properties:
                paymentMethodId: { type: string, example: pm_card_visa }
      responses:
        '202':
          description: Accepted — order PENDING, saga started. Poll GET /orders/{id} or subscribe to order status stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: Cart empty }
  /orders/{orderId}:
    get:
      tags: [orders]
      summary: Get order (used for live tracking after checkout)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { description: Not found }
  /orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: Cancel an order — compensates by releasing reserved stock and refunding any authorized payment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK (order CANCELLED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Order already cancelled or in a terminal state that cannot be cancelled
  /orders/{orderId}/stream:
    get:
      tags: [orders]
      summary: SSE stream of order status changes
      description: text/event-stream; each event data is a JSON Order.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: SSE stream }
