syntax = "proto3";

package inventory.v1;

service InventoryService {
  // Called by Order service during checkout saga.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
}

message StockItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  repeated StockItem items = 2;
}

message ReserveStockResponse {
  bool ok = 1;
  string reservation_id = 2;
  // Set when ok == false: the first product that could not be reserved.
  string rejected_product_id = 3;
  string reason = 4; // INSUFFICIENT_STOCK | PRODUCT_NOT_FOUND | RESERVATION_EXISTS
}

message ReleaseReservationRequest {
  string reservation_id = 1;
  string order_id = 2;
}

message ReleaseReservationResponse {
  bool ok = 1;
  string reason = 2; // RELEASED | ALREADY_RELEASED | NOT_FOUND
}

message GetStockRequest {
  string product_id = 1;
}

message GetStockResponse {
  string product_id = 1;
  int32 available = 2;
  int32 reserved = 3;
}
